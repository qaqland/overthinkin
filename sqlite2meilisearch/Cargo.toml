[package]
name = "sqlite2meilisearch"
version = "0.1.0"
edition = "2024"
description = "Fully synchronize a Meilisearch index from SQLite using SQL and Rhai"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
meilisearch-sdk = "0.33"
rhai = "1.26"
rusqlite = { version = "0.40", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
